<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ÇİZİK - Dijital Not Defteri</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- PDF.js & jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-workspace: #f1f5f9;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: rgba(203, 213, 225, 0.9);
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --text-main: #1e293b;
      --text-sub: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background-color: var(--bg-workspace);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      width: 100vw;
      height: 100vh;
      color: var(--text-main);
    }

    /* Taşınabilir Araç Çubuğu (Floating Draggable Toolbar) */
    .top-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 18px;
      display: flex;
      gap: 7px;
      align-items: center;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      max-width: 98vw;
      overflow-x: auto;
      touch-action: none;
    }

    .drag-handle {
      cursor: grab;
      padding: 4px 6px;
      color: #94a3b8;
      font-size: 14px;
      display: flex;
      align-items: center;
    }
    .drag-handle:active { cursor: grabbing; }

    .brand-group {
      display: flex;
      flex-direction: column;
      margin-right: 4px;
    }
    .brand-title {
      font-weight: 900;
      color: var(--primary);
      font-size: 15px;
      letter-spacing: 0.5px;
      line-height: 1;
    }
    .brand-author {
      font-size: 8px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.8px;
      margin-top: 2px;
      white-space: nowrap;
    }

    .btn {
      background: #f8fafc;
      color: var(--text-main);
      border: 1px solid #e2e8f0;
      padding: 5px 9px;
      border-radius: 9px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: #f1f5f9; }
    .btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .sep { width: 1px; height: 20px; background: #cbd5e1; margin: 0 2px; flex-shrink: 0; }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #cbd5e1;
      flex-shrink: 0;
    }
    .color-dot.active { transform: scale(1.15); box-shadow: 0 0 0 2px var(--primary); }
    .add-color-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px dashed #94a3b8;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      color: #64748b;
    }

    select, input[type="range"] {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 3px 5px;
      font-size: 11px;
      color: var(--text-main);
      outline: none;
    }

    /* İkon Seçim Menüsü */
    .sticker-menu {
      display: none;
      position: absolute;
      top: 55px;
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      z-index: 10001;
    }
    .sticker-menu.show { display: grid; }
    .sticker-item {
      font-size: 20px;
      padding: 6px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
    }
    .sticker-item:hover { background: var(--primary-light); }

    /* Çalışma Alanı */
    #viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 80px 20px 40px 20px;
    }
    #paper {
      position: relative;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(100, 116, 139, 0.18);
      border-radius: 6px;
      margin-bottom: 40px;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #bgCanvas, #hlCanvas, #inkCanvas { pointer-events: none; }
    #activeCanvas { pointer-events: auto; touch-action: none; cursor: crosshair; }
    #hlCanvas { mix-blend-mode: multiply; }

    /* Yapışkan Notlar */
    .sticky-note {
      position: absolute;
      width: 170px;
      min-height: 110px;
      background: #fef08a;
      border: 1px solid #fde047;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      padding: 8px;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: 13px;
      color: #713f12;
      z-index: 50;
      cursor: move;
    }
    .sticky-note textarea {
      width: 100%;
      height: 80px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    .sticky-close {
      position: absolute;
      top: 3px;
      right: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      color: #a16207;
    }
  </style>
</head>
<body>

<div class="top-bar" id="draggableToolbar">
  <div class="drag-handle" id="dragHandle" title="Taşımak için basılı tutup sürükleyin">⠿</div>
  
  <div class="brand-group">
    <span class="brand-title">ÇİZİK</span>
    <span class="brand-author">HAZIRLAYAN: YILDIRAY HOCA</span>
  </div>

  <div class="sep"></div>

  <!-- Kalemler -->
  <button class="btn active" id="fountainPenBtn">✒️ Dolma</button>
  <button class="btn" id="ballPenBtn">🖊️ Tükenmez</button>
  <button class="btn" id="brushPenBtn">🖌️ Fırça</button>
  <button class="btn" id="hlBtn">🖍️ Fosfor</button>
  
  <!-- Silgi Seçenekleri -->
  <button class="btn" id="strokeEraserBtn" title="Çizgiyi tamamen siler">🧹 Çizgi Silgisi</button>
  <button class="btn" id="partialEraserBtn" title="Parça parça siler">🧽 Parça Silgi</button>

  <div class="sep"></div>

  <!-- Renk & Şeffaflık -->
  <div style="display:flex; align-items:center; gap:4px;" id="paletteContainer">
    <div class="color-dot active" style="background:#0f172a;" data-color="#0f172a"></div>
    <div class="color-dot" style="background:#ef4444;" data-color="#ef4444"></div>
    <div class="color-dot" style="background:#2563eb;" data-color="#2563eb"></div>
    <div class="color-dot" style="background:#10b981;" data-color="#10b981"></div>
  </div>
  <input type="color" id="customColorPicker" style="display:none;">
  <div class="add-color-btn" id="addColorBtn" title="Özel Renk">+</div>

  <div class="sep"></div>

  <!-- Kalınlık & Opaklık -->
  <label style="font-size:11px; font-weight:600; color:var(--text-sub);">Boyut: 
    <input type="range" id="sizeRange" min="1" max="30" value="4" style="width:55px;">
  </label>
  <label id="opacityControl" style="font-size:11px; font-weight:600; color:var(--text-sub); display:none;">Saydamlık: 
    <input type="range" id="opacityRange" min="0.1" max="0.9" step="0.05" value="0.4" style="width:50px;">
  </label>

  <div class="sep"></div>

  <!-- İkon & Not -->
  <button class="btn" id="stickerBtn">⭐ İkon</button>
  <div class="sticker-menu" id="stickerMenu">
    <span class="sticker-item">⭐</span>
    <span class="sticker-item">⚠️</span>
    <span class="sticker-item">❓</span>
    <span class="sticker-item">❗</span>
    <span class="sticker-item">💡</span>
    <span class="sticker-item">📐</span>
    <span class="sticker-item">√x</span>
    <span class="sticker-item">π</span>
    <span class="sticker-item">∞</span>
    <span class="sticker-item">∫</span>
  </div>
  <button class="btn" id="addNoteBtn">📝 Not</button>

  <div class="sep"></div>

  <!-- PDF & Sayfa İşlemleri -->
  <label class="btn" style="cursor: pointer;">
    📁 PDF Aç
    <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
  </label>
  <button class="btn" id="addBlankPageBtn">➕ Boş Sayfa</button>
  
  <button class="btn" id="prevPageBtn" disabled>◀</button>
  <span style="font-size:11px; font-weight:700; min-width:45px; text-align:center;" id="pageInfo">1 / 1</span>
  <button class="btn" id="nextPageBtn" disabled>▶</button>

  <div class="sep"></div>
  <button class="btn" id="exportPdfBtn" style="background:#10b981; color:#fff; border-color:#059669;">📥 PDF İndir</button>
  <button class="btn" id="undoBtn">↩</button>
  <button class="btn" id="clearBtn">🗑️</button>
</div>

<div id="viewport">
  <div id="paper">
    <canvas id="bgCanvas"></canvas>
    <canvas id="hlCanvas"></canvas>
    <canvas id="inkCanvas"></canvas>
    <canvas id="activeCanvas"></canvas>
  </div>
</div>

<script>
  // 1. VERİTABANI YÖNETİCİSİ (IndexedDB)
  const DB_NAME = 'CizikDB';
  const STORE_NAME = 'project_state';
  let db;

  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      request.onsuccess = (e) => { db = e.target.result; resolve(db); };
      request.onerror = reject;
    });
  }

  function saveAppState() {
    if (!db) return;
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put({
      currentPage, totalPages, pageTypes, documentStrokes, stickyNotes,
      pdfDataBuffer: cachedPdfBuffer
    }, 'last_session');
  }

  function loadAppState() {
    return new Promise((resolve) => {
      if (!db) return resolve(null);
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get('last_session');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  // 2. CANVAS & GLOBAL DEĞİŞKENLER
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  const paper = document.getElementById('paper');
  const bgCanvas = document.getElementById('bgCanvas');
  const hlCanvas = document.getElementById('hlCanvas');
  const inkCanvas = document.getElementById('inkCanvas');
  const activeCanvas = document.getElementById('activeCanvas');

  const bgCtx = bgCanvas.getContext('2d');
  const hlCtx = hlCanvas.getContext('2d');
  const inkCtx = inkCanvas.getContext('2d');
  const activeCtx = activeCanvas.getContext('2d');

  const dpr = window.devicePixelRatio || 1;
  let width = 850;
  let height = 1200;

  function resizeCanvases(w, h) {
    width = w; height = h;
    paper.style.width = w + 'px';
    paper.style.height = h + 'px';

    [bgCanvas, hlCanvas, inkCanvas, activeCanvas].forEach(c => {
      c.width = w * dpr;
      c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    });
  }
  resizeCanvases(width, height);

  // Durum Yönetimi
  let currentTool = 'fountain'; // 'fountain' | 'ball' | 'brush' | 'highlighter' | 'strokeEraser' | 'partialEraser' | 'sticker'
  let currentColor = '#0f172a';
  let penSize = 4;
  let hlOpacity = 0.4;
  let activeSticker = null;

  let currentPage = 1;
  let totalPages = 1;
  let pageTypes = { 1: { type: 'grid' } };
  let documentStrokes = { 1: [] };
  let stickyNotes = { 1: [] };
  let pdfDoc = null;
  let cachedPdfBuffer = null;

  function renderBackground() {
    bgCtx.clearRect(0, 0, width, height);
    const pInfo = pageTypes[currentPage];

    if (!pInfo || pInfo.type === 'grid') {
      bgCtx.strokeStyle = 'rgba(100, 116, 139, 0.12)';
      bgCtx.lineWidth = 1;
      const step = 26;
      for (let x = 0; x <= width; x += step) {
        bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, height); bgCtx.stroke();
      }
      for (let y = 0; y <= height; y += step) {
        bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(width, y); bgCtx.stroke();
      }
    }
  }

  // 3. GELİŞMİŞ ÇİZİM MOTORU
  function renderSingleStroke(ctx, s) {
    if (s.type === 'sticker') {
      ctx.font = '32px sans-serif';
      ctx.fillText(s.icon, s.x, s.y);
      return;
    }

    if (!s.points || s.points.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = s.color;

    for (let i = 1; i < s.points.length; i++) {
      const p1 = s.points[i - 1];
      const p2 = s.points[i];

      let currentLineWidth = s.size;
      if (s.tool === 'fountain') {
        currentLineWidth = s.size * (0.2 + p2.p * 1.2);
      } else if (s.tool === 'brush') {
        currentLineWidth = s.size * (0.1 + Math.pow(p2.p, 2) * 1.8);
      } else if (s.tool === 'ball') {
        currentLineWidth = s.size;
      } else if (s.tool === 'highlighter') {
        currentLineWidth = s.size * 5;
      }

      ctx.lineWidth = currentLineWidth;
      ctx.beginPath();
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

      if (i === 1) {
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(mid.x, mid.y);
      } else {
        const prevMid = { x: (s.points[i - 2].x + p1.x) / 2, y: (s.points[i - 2].y + p1.y) / 2 };
        ctx.moveTo(prevMid.x, prevMid.y);
        ctx.quadraticCurveTo(p1.x, p1.y, mid.x, mid.y);
      }
      ctx.stroke();
    }
  }

  function redraw() {
    hlCtx.clearRect(0, 0, width, height);
    inkCtx.clearRect(0, 0, width, height);

    const pStrokes = documentStrokes[currentPage] || [];
    pStrokes.forEach(s => {
      const ctx = s.tool === 'highlighter' ? hlCtx : inkCtx;
      renderSingleStroke(ctx, s);
    });

    renderStickyNotes();
    updatePageNavUI();
    saveAppState();
  }

  // 4. ETKİLEŞİM & POINTER
  let isDrawing = false;
  let currentPoints = [];

  function getPointerPos(e) {
    const rect = activeCanvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (width / rect.width),
      y: (e.clientY - rect.top) * (height / rect.height),
      p: e.pressure && e.pressure > 0 ? e.pressure : 0.5
    };
  }

  activeCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const pos = getPointerPos(e);

    // İkonu Tıklanan Yere Anında Bas
    if (currentTool === 'sticker') {
      if (!documentStrokes[currentPage]) documentStrokes[currentPage] = [];
      documentStrokes[currentPage].push({
        type: 'sticker',
        tool: 'sticker',
        icon: activeSticker,
        x: pos.x - 14,
        y: pos.y + 14
      });
      redraw();
      setTool('fountain');
      return;
    }

    if (currentTool === 'strokeEraser') {
      eraseStrokeAt(pos.x, pos.y);
      isDrawing = true;
      return;
    } else if (currentTool === 'partialEraser') {
      erasePartialAt(pos.x, pos.y);
      isDrawing = true;
      return;
    }

    isDrawing = true;
    currentPoints = [pos];
    activeCanvas.setPointerCapture(e.pointerId);
    activeCanvas.style.mixBlendMode = currentTool === 'highlighter' ? 'multiply' : 'normal';
  });

  activeCanvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPointerPos(e);

    if (currentTool === 'strokeEraser') {
      eraseStrokeAt(pos.x, pos.y);
      return;
    } else if (currentTool === 'partialEraser') {
      erasePartialAt(pos.x, pos.y);
      return;
    }

    currentPoints.push(pos);
    activeCtx.clearRect(0, 0, width, height);

    let drawColor = currentColor;
    if (currentTool === 'highlighter') {
      const alphaHex = Math.round(hlOpacity * 255).toString(16).padStart(2, '0');
      drawColor = currentColor + alphaHex;
    }

    renderSingleStroke(activeCtx, {
      tool: currentTool,
      color: drawColor,
      size: penSize,
      points: currentPoints
    });
  });

  function stopDraw(e) {
    if (!isDrawing) return;
    isDrawing = false;
    try { activeCanvas.releasePointerCapture(e.pointerId); } catch(err){}

    if (!['strokeEraser', 'partialEraser', 'sticker'].includes(currentTool) && currentPoints.length > 1) {
      if (!documentStrokes[currentPage]) documentStrokes[currentPage] = [];

      let strokeColor = currentColor;
      if (currentTool === 'highlighter') {
        const alphaHex = Math.round(hlOpacity * 255).toString(16).padStart(2, '0');
        strokeColor = currentColor + alphaHex;
      }

      documentStrokes[currentPage].push({
        tool: currentTool,
        color: strokeColor,
        size: penSize,
        points: [...currentPoints]
      });

      activeCtx.clearRect(0, 0, width, height);
      redraw();
    }
    currentPoints = [];
  }

  activeCanvas.addEventListener('pointerup', stopDraw);
  activeCanvas.addEventListener('pointercancel', stopDraw);

  // Vektörel Çizgi Silgisi (Tamamen Siler)
  function eraseStrokeAt(x, y) {
    const list = documentStrokes[currentPage] || [];
    const prevLen = list.length;
    documentStrokes[currentPage] = list.filter(s => {
      if (s.type === 'sticker') return Math.hypot(s.x - x, s.y - y) > 30;
      return !s.points.some(p => Math.hypot(p.x - x, p.y - y) <= 24);
    });
    if (documentStrokes[currentPage].length !== prevLen) redraw();
  }

  // Parça Silgisi (Piksel / Segment Kesici)
  function erasePartialAt(x, y, radius = 18) {
    const list = documentStrokes[currentPage] || [];
    let modified = false;
    const newStrokes = [];

    for (const s of list) {
      if (s.type === 'sticker') {
        if (Math.hypot(s.x - x, s.y - y) > radius) newStrokes.push(s);
        else modified = true;
        continue;
      }

      let currentSegment = [];
      for (const p of s.points) {
        if (Math.hypot(p.x - x, p.y - y) > radius) {
          currentSegment.push(p);
        } else {
          if (currentSegment.length > 1) {
            newStrokes.push({ ...s, points: currentSegment });
            modified = true;
          }
          currentSegment = [];
        }
      }
      if (currentSegment.length > 1) {
        newStrokes.push({ ...s, points: currentSegment });
      }
      if (currentSegment.length !== s.points.length) modified = true;
    }

    if (modified) {
      documentStrokes[currentPage] = newStrokes;
      redraw();
    }
  }

  // 5. TAŞINABİLİR ARAÇ ÇUBUĞU (DRAGGABLE TOOLBAR)
  const toolbar = document.getElementById('draggableToolbar');
  const dragHandle = document.getElementById('dragHandle');
  let isDraggingToolbar = false;
  let tStartX, tStartY, initialLeft, initialTop;

  dragHandle.addEventListener('pointerdown', (e) => {
    isDraggingToolbar = true;
    dragHandle.setPointerCapture(e.pointerId);
    tStartX = e.clientX;
    tStartY = e.clientY;
    const rect = toolbar.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
    toolbar.style.transform = 'none';
  });

  dragHandle.addEventListener('pointermove', (e) => {
    if (!isDraggingToolbar) return;
    const dx = e.clientX - tStartX;
    const dy = e.clientY - tStartY;
    toolbar.style.left = Math.max(10, Math.min(window.innerWidth - toolbar.offsetWidth - 10, initialLeft + dx)) + 'px';
    toolbar.style.top = Math.max(10, Math.min(window.innerHeight - toolbar.offsetHeight - 10, initialTop + dy)) + 'px';
  });

  function stopDragToolbar(e) {
    if (isDraggingToolbar) {
      isDraggingToolbar = false;
      try { dragHandle.releasePointerCapture(e.pointerId); } catch(err){}
    }
  }
  dragHandle.addEventListener('pointerup', stopDragToolbar);
  dragHandle.addEventListener('pointercancel', stopDragToolbar);

  // 6. PDF VE SAYFA YÖNETİMİ
  async function renderPage(pageNum) {
    currentPage = pageNum;
    const pInfo = pageTypes[pageNum] || { type: 'grid' };

    if (pInfo.type === 'pdf' && pdfDoc) {
      const page = await pdfDoc.getPage(pInfo.pdfPageIndex);
      const unscaledViewport = page.getViewport({ scale: 1.0 });
      const targetWidth = 850;
      const scaleFactor = targetWidth / unscaledViewport.width;
      const viewport = page.getViewport({ scale: scaleFactor });

      resizeCanvases(Math.round(viewport.width), Math.round(viewport.height));
      bgCtx.clearRect(0, 0, width, height);

      await page.render({
        canvasContext: bgCtx,
        viewport: viewport,
        transform: [dpr, 0, 0, dpr, 0, 0]
      }).promise;
    } else {
      resizeCanvases(850, 1200);
      renderBackground();
    }

    redraw();
  }

  function updatePageNavUI() {
    document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = currentPage <= 1;
    document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
  }

  document.getElementById('addBlankPageBtn').onclick = () => {
    totalPages++;
    for (let i = totalPages; i > currentPage + 1; i--) {
      pageTypes[i] = pageTypes[i - 1];
      documentStrokes[i] = documentStrokes[i - 1];
      stickyNotes[i] = stickyNotes[i - 1];
    }
    pageTypes[currentPage + 1] = { type: 'grid' };
    documentStrokes[currentPage + 1] = [];
    stickyNotes[currentPage + 1] = [];
    currentPage++;
    renderPage(currentPage);
  };

  document.getElementById('pdfInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();
    cachedPdfBuffer = arrayBuffer;
    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    
    totalPages = pdfDoc.numPages;
    pageTypes = {};
    documentStrokes = {};
    stickyNotes = {};

    for (let i = 1; i <= totalPages; i++) {
      pageTypes[i] = { type: 'pdf', pdfPageIndex: i };
      documentStrokes[i] = [];
      stickyNotes[i] = [];
    }

    currentPage = 1;
    await renderPage(currentPage);
  };

  document.getElementById('prevPageBtn').onclick = () => {
    if (currentPage > 1) renderPage(currentPage - 1);
  };
  document.getElementById('nextPageBtn').onclick = () => {
    if (currentPage < totalPages) renderPage(currentPage + 1);
  };

  // 7. PDF DIŞA AKTARMA (PDF EXPORT)
  document.getElementById('exportPdfBtn').onclick = async () => {
    const { jsPDF } = window.jspdf;
    const btn = document.getElementById('exportPdfBtn');
    btn.textContent = '⏳ Hazırlanıyor...';
    btn.disabled = true;

    try {
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: [width, height] });
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = width;
      tempCanvas.height = height;

      for (let i = 1; i <= totalPages; i++) {
        if (i > 1) pdf.addPage([width, height], 'portrait');
        tempCtx.clearRect(0, 0, width, height);

        // 1. Arka Planı Çiz
        const pInfo = pageTypes[i];
        if (pInfo && pInfo.type === 'pdf' && pdfDoc) {
          const page = await pdfDoc.getPage(pInfo.pdfPageIndex);
          const vp = page.getViewport({ scale: width / page.getViewport({ scale: 1 }).width });
          await page.render({ canvasContext: tempCtx, viewport: vp }).promise;
        } else {
          tempCtx.fillStyle = '#ffffff';
          tempCtx.fillRect(0, 0, width, height);
          tempCtx.strokeStyle = 'rgba(100, 116, 139, 0.12)';
          tempCtx.lineWidth = 1;
          for (let x = 0; x <= width; x += 26) { tempCtx.beginPath(); tempCtx.moveTo(x,0); tempCtx.lineTo(x,height); tempCtx.stroke(); }
          for (let y = 0; y <= height; y += 26) { tempCtx.beginPath(); tempCtx.moveTo(0,y); tempCtx.lineTo(width,y); tempCtx.stroke(); }
        }

        // 2. Çizimleri ve Fosforları Bas
        const pStrokes = documentStrokes[i] || [];
        pStrokes.forEach(s => renderSingleStroke(tempCtx, s));

        // 3. PDF'e Aktar
        const imgData = tempCanvas.toDataURL('image/jpeg', 0.95);
        pdf.addImage(imgData, 'JPEG', 0, 0, width, height);
      }

      pdf.save(`cizik_ders_notu_${Date.now()}.pdf`);
    } catch (err) {
      alert('PDF dışa aktarılırken hata oluştu: ' + err.message);
    } finally {
      btn.textContent = '📥 PDF İndir';
      btn.disabled = false;
    }
  };

  // 8. BUTON VE MENÜ BAĞLANTILARI
  const toolBtns = {
    fountain: document.getElementById('fountainPenBtn'),
    ball: document.getElementById('ballPenBtn'),
    brush: document.getElementById('brushPenBtn'),
    highlighter: document.getElementById('hlBtn'),
    strokeEraser: document.getElementById('strokeEraserBtn'),
    partialEraser: document.getElementById('partialEraserBtn')
  };

  function setTool(tool) {
    currentTool = tool;
    Object.values(toolBtns).forEach(b => b.classList.remove('active'));
    if (toolBtns[tool]) toolBtns[tool].classList.add('active');
    document.getElementById('opacityControl').style.display = (tool === 'highlighter') ? 'inline-flex' : 'none';
  }

  toolBtns.fountain.onclick = () => setTool('fountain');
  toolBtns.ball.onclick = () => setTool('ball');
  toolBtns.brush.onclick = () => setTool('brush');
  toolBtns.highlighter.onclick = () => setTool('highlighter');
  toolBtns.strokeEraser.onclick = () => setTool('strokeEraser');
  toolBtns.partialEraser.onclick = () => setTool('partialEraser');

  // Palet
  document.getElementById('paletteContainer').addEventListener('click', (e) => {
    if (e.target.classList.contains('color-dot')) {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      e.target.classList.add('active');
      currentColor = e.target.dataset.color;
    }
  });

  const customColorPicker = document.getElementById('customColorPicker');
  document.getElementById('addColorBtn').onclick = () => customColorPicker.click();
  customColorPicker.onchange = (e) => {
    const col = e.target.value;
    const dot = document.createElement('div');
    dot.className = 'color-dot active';
    dot.style.background = col;
    dot.dataset.color = col;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    document.getElementById('paletteContainer').appendChild(dot);
    currentColor = col;
  };

  document.getElementById('sizeRange').oninput = (e) => { penSize = parseFloat(e.target.value); };
  document.getElementById('opacityRange').oninput = (e) => { hlOpacity = parseFloat(e.target.value); };

  // İkon Menüsü
  const stickerBtn = document.getElementById('stickerBtn');
  const stickerMenu = document.getElementById('stickerMenu');
  stickerBtn.onclick = () => stickerMenu.classList.toggle('show');

  document.querySelectorAll('.sticker-item').forEach(item => {
    item.onclick = () => {
      activeSticker = item.textContent;
      currentTool = 'sticker';
      stickerMenu.classList.remove('show');
      Object.values(toolBtns).forEach(b => b.classList.remove('active'));
    };
  });

  // Not Ekleme
  document.getElementById('addNoteBtn').onclick = () => {
    if (!stickyNotes[currentPage]) stickyNotes[currentPage] = [];
    stickyNotes[currentPage].push({ id: Date.now(), x: 60, y: 80, text: '' });
    redraw();
  };

  function renderStickyNotes() {
    document.querySelectorAll('.sticky-note').forEach(n => n.remove());
    const notes = stickyNotes[currentPage] || [];

    notes.forEach(n => {
      const noteEl = document.createElement('div');
      noteEl.className = 'sticky-note';
      noteEl.style.left = n.x + 'px';
      noteEl.style.top = n.y + 'px';

      noteEl.innerHTML = `
        <span class="sticky-close">✕</span>
        <textarea placeholder="Not yaz...">${n.text}</textarea>
      `;

      noteEl.querySelector('textarea').oninput = (e) => { n.text = e.target.value; saveAppState(); };
      noteEl.querySelector('.sticky-close').onclick = () => {
        stickyNotes[currentPage] = stickyNotes[currentPage].filter(x => x.id !== n.id);
        renderStickyNotes();
        saveAppState();
      };

      let isDragging = false, startX, startY;
      noteEl.onmousedown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.classList.contains('sticky-close')) return;
        isDragging = true;
        startX = e.clientX - n.x;
        startY = e.clientY - n.y;
      };
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        n.x = e.clientX - startX;
        n.y = e.clientY - startY;
        noteEl.style.left = n.x + 'px';
        noteEl.style.top = n.y + 'px';
      });
      window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; saveAppState(); } });

      paper.appendChild(noteEl);
    });
  }

  document.getElementById('undoBtn').onclick = () => {
    if (documentStrokes[currentPage] && documentStrokes[currentPage].length) {
      documentStrokes[currentPage].pop();
      redraw();
    }
  };
  document.getElementById('clearBtn').onclick = () => {
    documentStrokes[currentPage] = [];
    redraw();
  };

  // 9. BAŞLANGIÇTA OTOMATİK VERİTABANINDAN GERİ YÜKLE
  window.addEventListener('DOMContentLoaded', async () => {
    await initDB();
    const saved = await loadAppState();

    if (saved) {
      currentPage = saved.currentPage || 1;
      totalPages = saved.totalPages || 1;
      pageTypes = saved.pageTypes || { 1: { type: 'grid' } };
      documentStrokes = saved.documentStrokes || { 1: [] };
      stickyNotes = saved.stickyNotes || { 1: [] };

      if (saved.pdfDataBuffer) {
        cachedPdfBuffer = saved.pdfDataBuffer;
        pdfDoc = await pdfjsLib.getDocument({ data: saved.pdfDataBuffer }).promise;
      }
      await renderPage(currentPage);
    } else {
      renderBackground();
    }
  });
</script>
</body>
</html>
