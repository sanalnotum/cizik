<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ÇİZİK</title>
  
  <!-- Kararlı PDF.js Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #121218;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      width: 100vw;
      height: 100vh;
    }

    /* Üst Menü */
    .toolbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e28;
      border: 1px solid #333344;
      padding: 6px 12px;
      border-radius: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: #fff;
      z-index: 99999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .brand {
      font-weight: 900;
      color: #3b82f6;
      margin-right: 4px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .btn {
      background: #2a2a38;
      color: #e2e8f0;
      border: 1px solid #444455;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .sep { width: 1px; height: 18px; background: #444; margin: 0 2px; }
    
    input[type="color"] {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }
    select {
      background: #2a2a38;
      color: #fff;
      border: 1px solid #444455;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
    }
    .page-info {
      font-size: 12px;
      font-weight: bold;
      color: #94a3b8;
      min-width: 60px;
      text-align: center;
    }

    /* Tuval Alanı */
    #viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding-top: 45px;
    }
    #paper {
      position: relative;
      width: 800px;
      height: 1100px;
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      border-radius: 4px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #bgCanvas, #hlCanvas, #inkCanvas { pointer-events: none; }
    #activeCanvas { pointer-events: auto; touch-action: none; cursor: crosshair; }
    #hlCanvas { mix-blend-mode: multiply; }
  </style>
</head>
<body>

<div class="toolbar">
  <span class="brand">ÇİZİK</span>
  <button class="btn active" id="penBtn">✏️ Kalem</button>
  <button class="btn" id="hlBtn">🖍️ Fosfor</button>
  <button class="btn" id="eraserBtn">🧹 Silgi</button>
  
  <div class="sep"></div>
  <input type="color" id="strokeColor" value="#000000">
  <select id="bgTemplate">
    <option value="grid">Kareli</option>
    <option value="lines">Çizgili</option>
    <option value="blank">Beyaz</option>
    <option value="dark">Kara Tahta</option>
  </select>

  <div class="sep"></div>
  <label class="btn" style="cursor: pointer;">
    📄 PDF Aç
    <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
  </label>
  <button class="btn" id="prevPageBtn" disabled>◀</button>
  <span class="page-info" id="pageInfo">1 / 1</span>
  <button class="btn" id="nextPageBtn" disabled>▶</button>

  <div class="sep"></div>
  <button class="btn" id="undoBtn">↩ Geri Al</button>
  <button class="btn" id="clearBtn">🗑️ Temizle</button>
</div>

<div id="viewport">
  <div id="paper">
    <canvas id="bgCanvas"></canvas>
    <canvas id="hlCanvas"></canvas>
    <canvas id="inkCanvas"></canvas>
    <canvas id="activeCanvas"></canvas>
  </div>
</div>

<script>
  // PDF.js Worker
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  }

  const paper = document.getElementById('paper');
  const bgCanvas = document.getElementById('bgCanvas');
  const hlCanvas = document.getElementById('hlCanvas');
  const inkCanvas = document.getElementById('inkCanvas');
  const activeCanvas = document.getElementById('activeCanvas');

  const bgCtx = bgCanvas.getContext('2d');
  const hlCtx = hlCanvas.getContext('2d');
  const inkCtx = inkCanvas.getContext('2d');
  const activeCtx = activeCanvas.getContext('2d');

  const penBtn = document.getElementById('penBtn');
  const hlBtn = document.getElementById('hlBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const strokeColor = document.getElementById('strokeColor');
  const bgTemplate = document.getElementById('bgTemplate');
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const pdfInput = document.getElementById('pdfInput');
  const prevPageBtn = document.getElementById('prevPageBtn');
  const nextPageBtn = document.getElementById('nextPageBtn');
  const pageInfo = document.getElementById('pageInfo');

  const dpr = window.devicePixelRatio || 1;
  let width = 800;
  let height = 1100;

  function resizeCanvases(w, h) {
    width = w;
    height = h;
    paper.style.width = w + 'px';
    paper.style.height = h + 'px';

    [bgCanvas, hlCanvas, inkCanvas, activeCanvas].forEach(c => {
      c.width = w * dpr;
      c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    });
  }
  resizeCanvases(width, height);

  // Sayfa bazlı çizim deposu: { [sayfaNo]: Array<Stroke> }
  let currentTool = 'pen';
  let currentPage = 1;
  let totalPages = 1;
  let documentStrokes = { 1: [] };
  let pdfDoc = null;
  let isDrawing = false;
  let currentStroke = [];

  // Şablon Çizimi
  function drawTemplate() {
    if (pdfDoc) return;
    bgCtx.clearRect(0, 0, width, height);
    const mode = bgTemplate.value;

    if (mode === 'dark') {
      paper.style.background = '#1a1f2c';
      bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    } else {
      paper.style.background = '#ffffff';
      bgCtx.strokeStyle = 'rgba(0, 0, 0, 0.06)';
    }

    bgCtx.lineWidth = 1;
    if (mode === 'grid' || mode === 'dark') {
      for (let x = 0; x <= width; x += 25) {
        bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, height); bgCtx.stroke();
      }
      for (let y = 0; y <= height; y += 25) {
        bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(width, y); bgCtx.stroke();
      }
    } else if (mode === 'lines') {
      for (let y = 40; y <= height; y += 30) {
        bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(width, y); bgCtx.stroke();
      }
    }
  }
  drawTemplate();
  bgTemplate.onchange = drawTemplate;

  // Çizimleri Ekrana Basma
  function redraw() {
    hlCtx.clearRect(0, 0, width, height);
    inkCtx.clearRect(0, 0, width, height);

    const pageStrokes = documentStrokes[currentPage] || [];
    pageStrokes.forEach(s => {
      const ctx = s.tool === 'highlighter' ? hlCtx : inkCtx;
      renderSingleStroke(ctx, s);
    });
  }

  function renderSingleStroke(ctx, s) {
    if (!s.points || s.points.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = s.color;

    for (let i = 1; i < s.points.length; i++) {
      const p1 = s.points[i - 1];
      const p2 = s.points[i];
      ctx.lineWidth = s.size * (s.tool === 'highlighter' ? 1 : (0.4 + p2.p * 0.8));

      ctx.beginPath();
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      if (i === 1) {
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(mid.x, mid.y);
      } else {
        const prevMid = { x: (s.points[i - 2].x + p1.x) / 2, y: (s.points[i - 2].y + p1.y) / 2 };
        ctx.moveTo(prevMid.x, prevMid.y);
        ctx.quadraticCurveTo(p1.x, p1.y, mid.x, mid.y);
      }
      ctx.stroke();
    }
  }

  function getPos(e) {
    const rect = activeCanvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (width / rect.width),
      y: (e.clientY - rect.top) * (height / rect.height),
      p: e.pressure && e.pressure > 0 ? e.pressure : 0.5
    };
  }

  // Butonlar
  function setTool(t) {
    currentTool = t;
    penBtn.classList.toggle('active', t === 'pen');
    hlBtn.classList.toggle('active', t === 'highlighter');
    eraserBtn.classList.toggle('active', t === 'eraser');
  }

  penBtn.onclick = () => setTool('pen');
  hlBtn.onclick = () => setTool('highlighter');
  eraserBtn.onclick = () => setTool('eraser');

  undoBtn.onclick = () => {
    if (documentStrokes[currentPage] && documentStrokes[currentPage].length) {
      documentStrokes[currentPage].pop();
      redraw();
    }
  };

  clearBtn.onclick = () => {
    documentStrokes[currentPage] = [];
    redraw();
  };

  function eraseAt(x, y) {
    const pageStrokes = documentStrokes[currentPage] || [];
    const prev = pageStrokes.length;
    documentStrokes[currentPage] = pageStrokes.filter(s => {
      return !s.points.some(p => Math.hypot(p.x - x, p.y - y) <= 20);
    });
    if (documentStrokes[currentPage].length !== prev) redraw();
  }

  // Çizim Olayları
  activeCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    isDrawing = true;
    activeCanvas.setPointerCapture(e.pointerId);
    const pos = getPos(e);

    if (currentTool === 'eraser') {
      eraseAt(pos.x, pos.y);
    } else {
      currentStroke = [pos];
      activeCanvas.style.mixBlendMode = currentTool === 'highlighter' ? 'multiply' : 'normal';
    }
  });

  activeCanvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);

    if (currentTool === 'eraser') {
      eraseAt(pos.x, pos.y);
      return;
    }

    currentStroke.push(pos);
    activeCtx.clearRect(0, 0, width, height);

    const isHL = currentTool === 'highlighter';
    const strokeObj = {
      tool: currentTool,
      color: isHL ? strokeColor.value + '99' : strokeColor.value,
      size: isHL ? 22 : 4,
      points: currentStroke
    };
    renderSingleStroke(activeCtx, strokeObj);
  });

  function stopDraw(e) {
    if (!isDrawing) return;
    isDrawing = false;
    try { activeCanvas.releasePointerCapture(e.pointerId); } catch(err){}

    if (currentTool !== 'eraser' && currentStroke.length > 1) {
      const isHL = currentTool === 'highlighter';
      if (!documentStrokes[currentPage]) documentStrokes[currentPage] = [];
      
      documentStrokes[currentPage].push({
        tool: currentTool,
        color: isHL ? strokeColor.value + '99' : strokeColor.value,
        size: isHL ? 22 : 4,
        points: [...currentStroke]
      });
      activeCtx.clearRect(0, 0, width, height);
      redraw();
    }
    currentStroke = [];
  }

  activeCanvas.addEventListener('pointerup', stopDraw);
  activeCanvas.addEventListener('pointercancel', stopDraw);

  // --- PDF İŞLEMLERİ ---
  async function renderPDFPage(pageNum) {
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(pageNum);
    const unscaledViewport = page.getViewport({ scale: 1.0 });
    const targetWidth = 800;
    const scaleFactor = targetWidth / unscaledViewport.width;
    const viewport = page.getViewport({ scale: scaleFactor });

    resizeCanvases(Math.round(viewport.width), Math.round(viewport.height));

    paper.style.background = '#ffffff';
    bgCtx.clearRect(0, 0, width, height);

    await page.render({
      canvasContext: bgCtx,
      viewport: viewport,
      transform: [dpr, 0, 0, dpr, 0, 0]
    }).promise;

    pageInfo.textContent = `${currentPage} / ${totalPages}`;
    prevPageBtn.disabled = currentPage <= 1;
    nextPageBtn.disabled = currentPage >= totalPages;

    redraw();
  }

  pdfInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      const arrayBuffer = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPages = pdfDoc.numPages;
      currentPage = 1;
      documentStrokes = {};
      await renderPDFPage(currentPage);
    } catch (err) {
      alert("PDF Yüklenirken hata oluştu: " + err.message);
    }
  };

  prevPageBtn.onclick = async () => {
    if (currentPage > 1) {
      currentPage--;
      await renderPDFPage(currentPage);
    }
  };

  nextPageBtn.onclick = async () => {
    if (currentPage < totalPages) {
      currentPage++;
      await renderPDFPage(currentPage);
    }
  };
</script>
</body>
</html>
